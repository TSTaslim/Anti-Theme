; ============================================================================
; WallpaperGlass — Spicetify Color Scheme (color.ini)
; ============================================================================
; IMPORTANT: `main` and `sidebar` are kept as dark hex values (`0b0b10`) here
; because Spotify uses `--spice-main` as the foreground text/icon color inside
; bright pills, active filter chips, and play buttons. Actual panel transparency
; is handled safely in `user.css` and `theme.js`.

[base]
text               = f5f5fa
subtext            = c7c9d6
main               = 0b0b10
main-elevated      = 161622
highlight          = 242436
highlight-elevated = 2e2e44
sidebar            = 0b0b10
player             = 0b0b10
card               = 141420
shadow             = 000000
selected-row       = ffffff
button             = e84a7f
button-active      = ff6ea0
button-disabled    = 4a4b57
tab-active         = e84a7f
notification       = e84a7f
notification-error = e22134
misc               = 8a8d9f
